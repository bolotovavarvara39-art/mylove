<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя ❤️</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden; padding: 20px;
}
.hearts-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
.hearts-bg span { position: absolute; top: -10%; color: #e91e63; font-size: 20px; opacity: 0.7; animation: fall linear infinite; }
@keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}
.card {
    background: rgba(255,255,255,0.95); padding: 50px 40px; border-radius: 25px;
    box-shadow: 0 20px 50px rgba(216,27,96,0.25);
    max-width: 550px; width: 100%; position: relative; z-index: 10;
    animation: cardAppear 1.2s ease-out;
}
@keyframes cardAppear {
    0% { opacity: 0; transform: scale(0.9) translateY(20px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}
h1 { color: #d81b60; font-size: 26px; margin-bottom: 25px; font-weight: 700; line-height: 1.4; }
p { color: #444; font-size: 18px; line-height: 1.8; min-height: 150px; }
.cursor { display: inline-block; width: 2px; height: 20px; background-color: #d81b60; margin-left: 2px; animation: blink 0.8s infinite; vertical-align: middle; }
@keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
.heart { color: #e91e63; font-size: 50px; margin-top: 25px; display: inline-block; animation: beat 1.2s infinite; filter: drop-shadow(0 5px 15px rgba(233,30,99,0.4)); }
@keyframes beat { 0%,100% { transform: scale(1); } 25% { transform: scale(1.15); } 50% { transform: scale(1); } 75% { transform: scale(1.1); } }
@media (max-width: 600px) {
    .card { padding: 35px 25px; }
    h1 { font-size: 20px; }
    p { font-size: 16px; min-height: 180px; }
    .heart { font-size: 40px; }
}
</style>
</head>
<body>
<div class="hearts-bg" id="heartsBg"></div>
<div class="card">
    <h1>Для самого важного для меня человека❤️</h1>
    <p id="typedText"></p>
    <div class="heart">❤️</div>
</div>
<script>
const heartsBg = document.getElementById('heartsBg');
const symbols = ['❤️','💖','💕','💗','💓','💝'];
function createHeart() {
    const h = document.createElement('span');
    h.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    h.style.left = Math.random()*100 + '%';
    h.style.fontSize = (Math.random()*20+15) + 'px';
    h.style.animationDuration = (Math.random()*5+6) + 's';
    h.style.animationDelay = Math.random()*5 + 's';
    h.style.opacity = Math.random()*0.5 + 0.3;
    heartsBg.appendChild(h);
    setTimeout(() => h.remove(), 15000);
}
setInterval(createHeart, 400);
for (let i = 0; i < 15; i++) setTimeout(createHeart, i*200);

const text = "Котенок, я долго думала, как сказать это...\n\nТы — самый важный человек в моей жизни.\nЯ тебя очень сильно люблю люблю! Ты лучшее что со мной могло случиться❤️";
const el = document.getElementById('typedText');
const cursor = document.createElement('span');
cursor.className = 'cursor';
el.appendChild(cursor);
let i = 0;
function type() {
    if (i < text.length) {
        if (text[i] === '\n') el.insertBefore(document.createElement('br'), cursor);
        else el.insertBefore(document.createTextNode(text[i]), cursor);
        i++;
        setTimeout(type, 45);
    } else {
        setTimeout(() => cursor.style.display = 'none', 2000);
    }
}
setTimeout(type, 1000);
</script>
</body>
</html>
